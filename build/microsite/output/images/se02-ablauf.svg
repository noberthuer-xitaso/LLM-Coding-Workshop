<svg contentStyleType='text/css' data-diagram-type='ACTIVITY' height='650px' preserveAspectRatio='none' style='width:662px;height:650px;background:#FFFFFF;' version='1.1' viewBox='0 0 662 650' width='662px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><defs/><g><ellipse cx='415.7441' cy='20' fill='#222222' rx='10' ry='10' style='stroke:#222222;stroke-width:1;'/><rect fill='#F5F5F5' height='33.9688' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='213.8691' x='308.8096' y='50'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='193.8691' x='318.8096' y='71.1387'>Relevante Operation aufgerufen</text><rect fill='#F5F5F5' height='47.9375' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='213.6113' x='308.9385' y='103.9688'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='193.6113' x='318.9385' y='125.1074'>Ermittle mitglied_id aus Anfrage</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='77.8008' x='318.9385' y='139.0762'>oder Kontext</text><rect fill='#F5F5F5' height='89.8438' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='216.9863' x='307.251' y='171.9063'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='179.6074' x='317.251' y='193.0449'>F&#252;hre Datenbankabfrage aus:</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='196.9863' x='317.251' y='207.0137'>EXISTS(SELECT 1 FROM Ausleihe</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='146.8477' x='317.251' y='220.9824'>WHERE mitglied_id = :id</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='120.8379' x='317.251' y='234.9512'>AND status = 'aktiv'</text><text fill='#00