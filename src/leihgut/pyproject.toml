[project]
name = "leihgut"
version = "0.1.0"
description = "Werkzeugverleih — Bibliothek der Dinge"
authors = [
    { name = "Nicolai Oberthür", email = "nicolai.oberthuer@xitaso.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "pydantic>=2.9",
]

[project.scripts]
leihgut = "leihgut.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-bdd>=7",
    "httpx>=0.27",
    "anyio>=4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
